<!DOCTYPE html>
<html>
<head>
  <title>Signup - DiabetPredict AI</title>
  <style>
    body { 
      font-family: Arial, sans-serif;
      background: url('/static/images/img2.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    /* --- NAVBAR --- */
    nav { 
      width: 100%;
      padding: 12px 20px;
      background: rgba(30, 60, 114, 0.85);
      display: flex; 
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
    }

    /* NAV BUTTONS GROUP */
    .nav-links {
      display: flex;
      gap: 15px;   /* space between Home and Login */
    }

    /* NAV BUTTON STYLE */
    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 8px 14px;
      background: rgba(255,255,255,0.25);
      border-radius: 6px;
      border: 1px solid white;
    }

    .nav-links a:hover {
      background: rgba(255,255,255,0.45);
      color: black;
    }

    /* --- SIGNUP FORM BOX (TRANSPARENT) --- */
    .container {
      width: 380px;
      margin: 120px auto; 
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(10px); 
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      color: white;
    }

    h2 {
      text-align: center;
      color: white;
      text-shadow: 0 0 4px black;
    }

    input[type=text],
    input[type=email],
    input[type=password] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ddd;
      background: rgba(255,255,255,0.7);
    }

    input[type=submit] {
      width: 100%;
      padding: 12px;
      background: #1e3c72;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    input[type=submit]:hover {
      background: #16325c;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo">🏥 DiabetPredict AI</div>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/login">Login</a>
    </div>
  </nav>

  <!-- SIGNUP BOX -->
  <div class="container">
    <h2>Signup</h2>
    <form method="POST" action="/signup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="submit" value="Signup">
    </form>
  </div>

</body>
</html>
