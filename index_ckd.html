<!DOCTYPE html>
<html>
<head>
    <title>CKD Prediction - DiabetPredict AI</title>
    <style>
        body { 
            background: url('/static/images/img1.jpg') no-repeat center center fixed; 
            background-size: cover;
            font-family: Arial, sans-serif; 
            margin:0; 
            padding:0; 
        }

        /* Navbar */
        nav { 
            width:100%; 
            padding:15px 30px; 
            background: rgba(30,60,114,0.95); 
            display:flex; 
            justify-content: space-between; 
            align-items:center; 
            position: fixed; 
            top:0; 
            left:0;
            z-index:1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            overflow: visible; 
            box-sizing: border-box;
        }

        nav .logo { 
            font-size:1.5rem; 
            color:#fff; 
            font-weight:bold; 
        }

        nav .nav-buttons {
            margin-left: auto;
        }

        nav  a { 
            display:inline-block;
            padding:10px 20px;
            font-weight:bold;
            background:#00d4ff;
            color:#112240;
            border-radius:5px;
            text-decoration:none;
            transition:0.3s;
        }

        nav  a:hover { 
            background:#0077aa; 
            color:white; 
        }

        .spacer { height:70px; }

        /* Form container */
        .container {
            max-width: 950px;
            margin: 0 auto 50px; 
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Transparent boxes (updated) */
        .box {
            flex: 1 1 400px;
            background: rgba(255,255,255,0.10);  /* transparent */
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius:12px; 
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .box:hover {
            transform: translateY(-10px);
            box-shadow: 0 16px 30px rgba(0,0,0,0.4);
        }

        h2 { color:white; text-align:center; margin-bottom:15px; text-shadow:0 0 4px black; }

        input, select, button { 
            width:100%; 
            padding:12px; 
            margin:8px 0; 
            border:1px solid #ccc; 
            border-radius:5px; 
            background:white;
            font-size: 14px;
            box-sizing: border-box;
        }

        button { 
            background:#4CAF50; 
            color:white; 
            border:none; 
            cursor:pointer; 
            font-weight:bold;
        }
        button:hover { background:#45a049; }
    </style>
</head>
<body>

<nav>
    <div class="logo">🏥 NephroPredict AI</div>
    <a href="/">Home</a>
</nav>

<div class="spacer"></div>

<div class="container">
<form action="/predict_ckd" method="POST" style="display:flex;flex-wrap:wrap;gap:20px;width:100%;">

     <!-- COLUMN 1 : Patient Info -->
<div class="box">
    <h2>Patient Information</h2>

    <input type="number" name="Age" placeholder="Age" required>

    <select name="Gender" required>
        <option disabled selected>Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <select name="Ethnicity" required>
        <option disabled selected>Ethnicity</option>
        <option value="Asian">Asian</option>
        <option value="African">African</option>
        <option value="Caucasian">Caucasian</option>
        <option value="Hispanic">Hispanic</option>
        <option value="Other">Other</option>
    </select>

    <input type="number" step="0.1" name="BMI" placeholder="BMI" required>

    <input type="number" step="0.1" name="Systolic_BP" placeholder="Systolic BP" required>
    <input type="number" step="0.1" name="Diastolic_BP" placeholder="Diastolic BP" required>

    <select name="Smoking_Status" required>
        <option disabled selected>Smoking Status</option>
        <option value="No">No</option>
        <option value="Former">Former</option>
        <option value="Yes">Yes</option>
    </select>

    <select name="Alcohol_Consumption" required>
        <option disabled selected>Alcohol Consumption</option>
        <option value="None">None</option>
        <option value="Light">Light</option>
        <option value="Moderate">Moderate</option>
        <option value="Heavy">Heavy</option>
    </select>

    <input type="number" step="0.1" name="HbA1c" placeholder="HbA1c (%)" required>
    <input type="number" step="0.1" name="Fasting_Glucose" placeholder="Fasting Glucose (mg/dL)" required>

    <select name="Diabetes_Status" required>
        <option disabled selected>Diabetes Status</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<!-- COLUMN 2 : Kidney & Lab Metrics -->
<div class="box">
    <h2>Kidney & Lab Metrics</h2>

    <input type="number" step="0.01" name="Serum_Creatinine" placeholder="Serum Creatinine" required>
    <input type="number" step="0.1" name="eGFR" placeholder="eGFR" required>
    <input type="number" step="0.1" name="BUN" placeholder="BUN" required>
    <input type="number" step="0.1" name="Albumin" placeholder="Albumin" required>
    <input type="number" step="0.1" name="UACR" placeholder="UACR" required>

    <select name="Proteinuria" required>
        <option disabled selected>Proteinuria</option>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>

    <input type="number" step="0.1" name="Potassium" placeholder="Potassium" required>
    <input type="number" step="0.1" name="Sodium" placeholder="Sodium" required>
    <input type="number" step="0.1" name="Phosphate" placeholder="Phosphate" required>
    <input type="number" step="0.1" name="Calcium" placeholder="Calcium" required>

    <button type="submit">Predict CKD</button>
</div>


</form>
</div>

</body>
</html>
