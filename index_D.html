<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction - DiabetPredict AI</title>
    <style>
        body { 
            background: url('/static/images/img1.jpg') no-repeat center center fixed; 
            background-size: cover;
            font-family: Arial, sans-serif; 
            margin:0; 
            padding:0; 
        }

        /* Navbar */
        nav { 
            width:100%; 
            padding:15px 30px; 
            background: rgba(30,60,114,0.95); 
            display:flex; 
            justify-content: space-between; 
            align-items:center; 
            position: fixed; 
            top:0; 
            left:0;
            z-index:1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            overflow: visible; 
            box-sizing: border-box;
        }

        nav .logo { 
            font-size:1.5rem; 
            color:#fff; 
            font-weight:bold; 
        }

        nav .nav-buttons {
            margin-left: auto;
        }

        nav .nav-buttons a { 
            display:inline-block;
            padding:10px 20px;
            font-weight:bold;
            background:#00d4ff;
            color:#112240;
            border-radius:5px;
            text-decoration:none;
            transition:0.3s;
        }

        nav .nav-buttons a:hover { 
            background:#0077aa; 
            color:white; 
        }

        .spacer { height:70px; }

        /* Form container */
        .container {
            max-width: 950px;
            margin: 0 auto 50px; 
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Transparent boxes (updated) */
        .box {
            flex: 1 1 400px;
            background: rgba(255,255,255,0.10);  /* transparent */
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius:12px; 
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .box:hover {
            transform: translateY(-10px);
            box-shadow: 0 16px 30px rgba(0,0,0,0.4);
        }

        h2 { color:white; text-align:center; margin-bottom:15px; text-shadow:0 0 4px black; }

        input, select, button { 
            width:100%; 
            padding:12px; 
            margin:8px 0; 
            border:1px solid #ccc; 
            border-radius:5px; 
            background:white;
            font-size: 14px;
            box-sizing: border-box;
        }

        button { 
            background:#4CAF50; 
            color:white; 
            border:none; 
            cursor:pointer; 
            font-weight:bold;
        }
        button:hover { background:#45a049; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="logo">🏥 DiabetPredict AI</div>
    <div class="nav-buttons">
        <a href="/">Home</a>
    </div>
</nav>

<div class="spacer"></div>

<!-- Two-column Floating Form Container -->
<div class="container">
    <form action="/predict_diabetes" method="POST" style="display:flex; flex-wrap:wrap; gap:20px; width:100%; justify-content:center;">

        <!-- Column 1 -->
        <div class="box">
            <h2>Patient Info</h2>
            <input type="number" step="0.1" name="Age" placeholder="Age" required>
            <select name="Gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>
            <select name="Ethnicity" required>
                <option value="" disabled selected>Select Ethnicity</option>
                <option value="Asian">Asian</option>
                <option value="African">African</option>
                <option value="African American">African American</option>
                <option value="Caucasian">Caucasian</option>
                <option value="Hispanic">Hispanic</option>
                <option value="Other">Other</option>
            </select>
            <select name="Family_History_Diabetes" required>
                <option value="" disabled selected>Family History of Diabetes?</option>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
            <input type="number" step="0.1" name="BMI" placeholder="BMI" required>
            <input type="number" step="0.1" name="Systolic_BP" placeholder="Systolic BP" required>
            <input type="number" step="0.1" name="Diastolic_BP" placeholder="Diastolic BP" required>
        </div>

        <!-- Column 2 -->
        <div class="box">
            <h2>Health Metrics</h2>
            <input type="number" step="0.1" name="Waist_Circumference" placeholder="Waist Circumference" required>
            <select name="Physical_Activity" required>
                <option value="" disabled selected>Physical Activity Level</option>
                <option value="0">Low</option>
                <option value="1">Moderate</option>
                <option value="2">High</option>
            </select>
            <select name="Smoking_Status" required>
                <option value="" disabled selected>Select Smoking Status</option>
                <option>Never</option>
                <option>Former</option>
                <option>Current</option>
            </select>
            <select name="Alcohol_Consumption" required>
                <option value="" disabled selected>Alcohol Consumption</option>
                <option>None</option>
                <option>Light</option>
                <option>Moderate</option>
                <option>Heavy</option>
            </select>
            <input type="number" step="0.1" name="Fasting_Glucose_mg_dL" placeholder="Fasting Glucose (mg/dL)" required>
            <input type="number" step="0.1" name="HbA1c_Percent" placeholder="HbA1c (%)" required>

            <button type="submit">Predict</button>
        </div>

    </form>
</div>

</body>
</html>
